<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 22px 24px; background: var(--surface); display:flex; flex-direction:column; gap:14px; }
  .labels { display:flex; flex-wrap:wrap; gap:10px 20px; }
  .lab { font: 500 13px/1 var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink); }
  .num { font: 500 13px/1 var(--font-mono); color: var(--orange); }
  .meta { font: 500 11px/1 var(--font-mono); letter-spacing: 0.06em; color: var(--ink-60); text-transform: uppercase; }
</style>
</head>
<body>
  <div class="labels">
    <span class="lab">Franchise</span>
    <span class="lab">Attractions</span>
    <span class="lab">Visit park</span>
    <span class="lab"><span class="num">01</span>&nbsp;Principles</span>
    <span class="lab"><span class="num">02</span>&nbsp;Color</span>
  </div>
  <div class="meta">DM Mono · 500 · tracking 0.08em · uppercase</div>
</body>
</html>
