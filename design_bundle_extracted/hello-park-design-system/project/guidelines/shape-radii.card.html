<!-- @dsCard group="Spacing" viewport="700x160" name="Radii" subtitle="sm 12 · md 20 · lg 32 · pill — big friendly corners" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 22px 24px; background: var(--surface); }
  .row { display: flex; gap: 18px; align-items: flex-end; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .box { width: 86px; height: 70px; background: var(--orange-50); border: 1.5px solid var(--orange); }
  .pill { width: 120px; border-radius: var(--radius-pill); }
  .lab { font: 500 11px/1 var(--font-mono); color: var(--ink-60); text-transform: uppercase; letter-spacing: 0.05em; }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="border-radius: var(--radius-sm);"></div><span class="lab">sm · 12</span></div>
    <div class="item"><div class="box" style="border-radius: var(--radius-md);"></div><span class="lab">md · 20</span></div>
    <div class="item"><div class="box" style="border-radius: var(--radius-lg);"></div><span class="lab">lg · 32</span></div>
    <div class="item"><div class="box pill"></div><span class="lab">pill · 999</span></div>
  </div>
</body>
</html>
