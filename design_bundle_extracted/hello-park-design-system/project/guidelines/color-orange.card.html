<!-- @dsCard group="Colors" viewport="700x150" name="Brand orange" subtitle="Primary ramp — one saturated orange per block" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px; background: var(--surface); font-family: var(--font-mono); }
  .row { display: flex; gap: 12px; }
  .sw { flex: 1; border-radius: var(--radius-md); padding: 14px; min-height: 96px; display: flex; flex-direction: column; justify-content: flex-end; color: #fff; }
  .name { font-size: 12px; font-weight: 500; letter-spacing: 0.04em; }
  .hex { font-size: 11px; opacity: 0.85; margin-top: 2px; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw" style="background: var(--orange);"><span class="name">orange</span><span class="hex">#FF6022 · primary</span></div>
    <div class="sw" style="background: var(--orange-deep);"><span class="name">deep</span><span class="hex">#F74A0D</span></div>
    <div class="sw" style="background: var(--orange-bright);"><span class="name">bright</span><span class="hex">#FF7F00</span></div>
    <div class="sw" style="background: var(--amber); color: var(--ink);"><span class="name">amber</span><span class="hex">#FFB400</span></div>
  </div>
</body>
</html>
